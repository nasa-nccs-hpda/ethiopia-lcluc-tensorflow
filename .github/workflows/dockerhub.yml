name: Build publication container
# Container publishing is an explicit release operation, not a side effect of every push.
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Tested base image tag or digest
        required: true
        type: string
      image_tag:
        description: Output image tag (use a versioned tag for publication)
        required: true
        type: string
      push:
        description: Push the built image to Docker Hub
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: requirements/Dockerfile
          build-args: BASE_IMAGE=${{ inputs.base_image }}
          push: ${{ inputs.push }}
          tags: nasanccs/ethiopia-lcluc-tensorflow:${{ inputs.image_tag }}
