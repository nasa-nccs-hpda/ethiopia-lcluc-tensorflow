name: CPU tests and package build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[validation,test]'
      - run: python -m pytest -q
      - run: node --check app/ethiopia-lcluc.js
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test installed command entry points
        run: |
          ethiopia-cnn --help
          ethiopia-composite --help
          ethiopia-rf --help
          ethiopia-validate --help
